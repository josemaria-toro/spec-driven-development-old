name: Nueva funcionalidad
description: Propuesta de una nueva funcionalidad para la plataforma
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe la funcionalidad desde el punto de vista funcional. Los campos de cierre se rellenan cuando el ticket se cierra.

  - type: textarea
    id: description
    attributes:
      label: Descripción funcional del cambio
      description: Qué problema resuelve, qué comportamiento se espera y para quién.
      placeholder: Describe el cambio desde el punto de vista del usuario.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Criterios de aceptación
      description: Lista verificable de condiciones que deben cumplirse para dar la funcionalidad por terminada.
      placeholder: |
        - [ ] Dado ..., cuando ..., entonces ...
        - [ ] ...
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Estado
      description: Estado actual del ticket.
      options:
        - Todo
        - In Evaluation
        - Accepted
        - Rejected
        - In Progress
        - Blocked
        - Ready
        - Done
      default: 0
    validations:
      required: true

  - type: input
    id: created_at
    attributes:
      label: Fecha de creación
      description: Formato YYYY-MM-DD.
      placeholder: "2026-10-24"
    validations:
      required: true

  - type: input
    id: closed_at
    attributes:
      label: Fecha de cierre
      description: Formato YYYY-MM-DD. Rellenar solo al cerrar el ticket.
      placeholder: "2026-10-31"

  - type: textarea
    id: close_reason
    attributes:
      label: Motivo del cierre
      description: Explicación breve de por qué se cierra el ticket. Rellenar solo al cerrar el ticket.

  - type: input
    id: closed_by
    attributes:
      label: Cerrado por
      description: Persona que cierra el ticket. Rellenar solo al cerrar el ticket.
